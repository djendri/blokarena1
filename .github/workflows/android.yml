
name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.128.0

          mkdir www
          cp ../index.html ../icon-192.png ../icon-512.png ../manifest.webmanifest www/
          cp node_modules/three/build/three.min.js www/three.min.js

          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html

          npx cap init BLOKARENA com.blokarena.game --web-dir www
          npx cap add android
          npx cap sync android

          sed -i 's/<activity/<activity android:screenOrientation="landscape" android:windowSoftInputMode="adjustResize"/' android/app/src/main/AndroidManifest.xml

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BLOKARENA-Android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
