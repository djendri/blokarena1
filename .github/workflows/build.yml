name: Krijo Instaluesin Windows (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Shkarko kodin nga GitHub
        uses: actions/checkout@v4

      - name: Konfiguro Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalo libraritë
        run: npm install --no-audit --no-fund

      - name: Kontrollo sintaksën e main.js
        run: node --check main.js

      - name: Ndërto instaluesin Windows (.exe)
        run: npm run dist

      - name: Ngarko instaluesin (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BLOKARENA-3D-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
