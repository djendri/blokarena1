name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get three.js locally
        shell: bash
        run: |
          npm install three@0.128.0 --no-save
          cp node_modules/three/build/three.min.js three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' index.html
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: BLOKARENA-Windows
          path: dist/*.exe
