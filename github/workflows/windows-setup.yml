name: BLOKARENA Setup EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          mkdir setup_pkg
          Copy-Item index.html setup_pkg\index.html

          @'
          {
            "name": "blokarena",
            "productName": "BLOKARENA",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win nsis --x64"
            },
            "build": {
              "appId": "com.djendri.blokarena",
              "productName": "BLOKARENA",
              "win": { "target": "nsis" },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true
              }
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          '@ | Set-Content setup_pkg\package.json -Encoding UTF8

          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          app.whenReady().then(() => {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              autoHideMenuBar: true,
              title: 'BLOKARENA'
            });
            win.loadFile(path.join(__dirname, 'index.html'));
          });

          app.on('window-all-closed', () => app.quit());
          '@ | Set-Content setup_pkg\main.js -Encoding UTF8

          cd setup_pkg
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: BLOKARENA-Setup
          path: setup_pkg/dist/*Setup*.exe
